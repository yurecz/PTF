[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abap-artifacts-mcp"
version = "0.1.0"
description = "Read-only MCP server for fetching ABAP artifacts (uses local env/keychain credentials)"
requires-python = ">=3.10"

[project.scripts]
abap-artifacts-mcp = "abap_artifacts_mcp.__main__:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["abap_artifacts_mcp*"]
