[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abap-artifacts"
version = "0.1.0"
description = "Credential-isolated fetcher for ABAP artifacts (ADT/Keyword Docu)"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "keyring>=25.0.0",
]

[project.scripts]
abap-artifacts = "abap_artifacts.__main__:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["abap_artifacts*"]
